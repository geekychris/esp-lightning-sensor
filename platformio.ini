; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf

; Serial Monitor settings
monitor_speed = 115200
monitor_filters = 
	direct
	time
	colorize

; Build settings
build_flags =
	-DMQTT_MAX_PACKET_SIZE=1024
	-DMQTT_KEEPALIVE=60
	-DI2C_MASTER_SCL_IO=22
	-DI2C_MASTER_SDA_IO=21
	-DI2C_MASTER_FREQ_HZ=100000

; Library dependencies
lib_deps =
	knolleary/PubSubClient @ ^2.8

; Partition table settings - using a custom partition table for OTA support
board_build.partitions = partitions.csv

; Upload settings
upload_speed = 921600

; Debug settings
debug_tool = esp-prog
debug_init_break = tbreak setup

; Additional build flags for different environments
[env:debug]
platform = espressif32
board = esp32dev
framework = espidf
build_type = debug
build_flags = 
	${env:esp32dev.build_flags}
	-DCORE_DEBUG_LEVEL=5

[env:release]
platform = espressif32
board = esp32dev
framework = espidf
build_type = release
build_flags = 
	${env:esp32dev.build_flags}
	-DCORE_DEBUG_LEVEL=3

